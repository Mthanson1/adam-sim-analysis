[project]
name = "adam_common"
version = "0.1.0"
description = "Shared helpers for ADAM simulation and analysis"
requires-python = ">=3.10"
dependencies = ["numpy", "matplotlib"]

[build-system]
requires = ["setuptools>=61"]
build-backend = "setuptools.build_meta"

[tool.setuptools]
packages = ["adam_common"]
