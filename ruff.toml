line-length = 100
target-version = "py310"
extend-exclude = [".venv"]

[lint]
# E/W: pycodestyle, F: pyflakes (unused/undefined names), I: import sorting,
# B: bugbear (likely bugs), UP: modern syntax, SIM: simplifications
select = ["E", "W", "F", "I", "B", "UP", "SIM"]
# Engineering code uses math-style names (D, F_n, K) on purpose, so pep8-naming is off.

[lint.isort]
known-first-party = ["adam_common"]

[format]
quote-style = "preserve"
