name: Lint

on:
  pull_request:
  push:
    branches: [main]

jobs:
  ruff:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.13"
      # Keep in sync with the ruff pin in requirements.txt
      - run: pip install ruff==0.17.6
      - run: ruff check --output-format=github .
